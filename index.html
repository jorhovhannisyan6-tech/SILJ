    <script>
      // Gracefully catch and ignore harmless Vite/WebSocket HMR and unexpected HTML-in-JSON errors in preview environments
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.indexOf('websocket') !== -1 || 
          event.message.indexOf('WebSocket') !== -1 || 
          event.message.indexOf('[vite]') !== -1 ||
          event.message.indexOf('is not valid JSON') !== -1 ||
          event.message.indexOf("Unexpected token '<'") !== -1
        )) {
          console.warn('Prevented benign runtime error from bubbling:', event.message);
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason;
        const msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
        if (msg && (
          msg.indexOf('websocket') !== -1 || 
          msg.indexOf('WebSocket') !== -1 || 
          msg.indexOf('[vite]') !== -1 ||
          msg.indexOf('WebSocket closed without opened') !== -1 ||
          msg.indexOf('is not valid JSON') !== -1 ||
          msg.indexOf("Unexpected token '<'") !== -1
        )) {
          console.warn('Prevented benign promise rejection from bubbling:', msg);
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
